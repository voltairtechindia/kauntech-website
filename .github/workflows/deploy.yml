# Push-to-deploy: every push to main ships to Vercel production.
#
# Uses a Vercel token rather than the Vercel GitHub App, because this repo is
# owned by `voltairtechindia` while the Vercel account is a separate one — the
# App can't bridge that, but a token can. Source is uploaded and BUILT ON VERCEL,
# so the project's env vars (set via `vercel env add`) apply automatically and
# nothing secret needs to live in GitHub beyond the token itself.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # ⚠️ DO NOT let Vercel see git metadata here.
      #
      # Vercel attributes a deploy to the GIT COMMIT AUTHOR and requires that
      # author to be a contributor on the Vercel project. The Hobby plan allows
      # exactly one contributor and does not support collaboration on private
      # repos, so a deploy authored by `voltairtechindia` (who owns this repo but
      # is not the Vercel account) is rejected before it ever builds:
      #
      #   "Deployment Blocked — the deployment was blocked because the commit
      #    author did not have contributing access to the project on Vercel."
      #
      # Stripping .git makes this an ordinary CLI upload with no author attached —
      # the same path as a local `vercel --prod`, which Hobby allows.
      - name: Strip git attribution
        run: rm -rf .git

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee /dev/stderr | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Blank the CI git signals the Vercel CLI would otherwise pick up.
          GITHUB_SHA: ''
          GITHUB_REF: ''
          GITHUB_REPOSITORY: ''
          GITHUB_ACTOR: ''
          GITHUB_HEAD_REF: ''
          VERCEL_GIT_PROVIDER: ''

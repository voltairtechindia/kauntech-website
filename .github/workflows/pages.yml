# Builds the static site (out/) and publishes it on GitHub Pages.
#
# Runs on every push to main, every 4 hours (so new blog posts, careers and FAQ edits
# show up without a push), and on demand from the Actions tab.
#
# The site is fully static. If the repo secret SUPABASE_SERVICE_KEY is set and
# works, database-backed content (blog posts etc.) is read during the build;
# otherwise the site builds from what is in the code alone. The key is only used
# during the build and never reaches the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"
      - "changes.bundle"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Load build settings
        env:
          SECRET_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          : > .env.build
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            # Public settings (store links, app keys meant for browsers) from the old Vercel project.
            npx --yes vercel@63.1.2 env pull .env.vercel --environment=production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            # Vercel writes "[sensitive]" for write-only variables; skip those.
            grep -E '^(NEXT_PUBLIC_[A-Z0-9_]+|ANDROID_PLAY_SIGNING_SHA256|IOS_APP_TEAM_ID|IOS_APP_URL|ANDROID_APP_URL)=' .env.vercel | grep -v -E '="?\[[a-z ]*\]"?$' >> .env.build 2>/dev/null || true
          fi
          SUPABASE_URL="https://ujzchcirgmveryjavfzk.supabase.co"
          key="${SECRET_SERVICE_KEY:-}"
          rm -f .env.vercel
          code=000
          if [ -n "$key" ]; then
            echo "::add-mask::$key"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/" -H "apikey: $key" -H "Authorization: Bearer $key" || echo 000)
          fi
          cp .env.build .env.production.local
          if [ "$code" = "200" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_KEY=%s\n' "$SUPABASE_URL" "$key" >> .env.production.local
            echo "Build mode: database (blog posts and other database content included)"
          else
            echo "::notice::Build mode: static only (no working SUPABASE_SERVICE_KEY secret, database content skipped)"
          fi
          rm -f .env.build
          echo "Public settings loaded: $(cut -d= -f1 .env.production.local | grep -v SUPABASE_SERVICE_KEY | tr '\n' ' ')"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # GitHub switches off scheduled runs in a repo with no commits for 60 days.
      # One empty commit every ~50 quiet days keeps the 4-hourly rebuild alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled site rebuilds running"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
